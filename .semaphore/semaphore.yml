version: v1.0
name: build-test-release
agent:
  machine:
    type: s1-prod-ubuntu24-04-arm64-00

auto_cancel:
  running:
    when: "branch != 'main'"

execution_time_limit:
  hours: 1

queue:
  - when: "branch != 'main'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - checkout
      - . vault-setup
      - curl -LsSf https://astral.sh/uv/0.10.11/install.sh | sh
      - uv sync --frozen
      - export VERSION=$(grep '^__version__' src/confluent_sql/__version__.py | cut -d'"' -f2)

blocks:
  - name: "Test"
    dependencies: []
    task:
      prologue:
        commands:
          # The ServiceBot-managed global prologue pins an older uv (0.10.11) whose interpreter
          # manifest only knows 3.15.0a7, a pre-release that breaks anyio's pytest plugin. Install
          # our own exact uv over it, then rebuild the venv it just made (the stale alpha venv
          # would otherwise satisfy `UV_PYTHON=3.15` and be reused). Drop this once the managed
          # pin is new enough to resolve 3.15 to a final release.
          - curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
          - uv --version
          - rm -rf .venv
          - uv sync --frozen
      jobs:
        # Lint and type checking don't vary by interpreter (ruff and pyright take their target
        # version from pyproject.toml), so run them once, on the minimum supported Python. Semaphore
        # has no job-level env_vars, so a single-value matrix sets UV_PYTHON for the job.
        - name: "Lint and Type Check"
          matrix:
            - env_var: UV_PYTHON
              values: ["3.11"]
          commands:
            - uv run --frozen ruff format --check && uv run --frozen ruff check && uv run --frozen pyright
        # The unit tests run on every supported Python. UV_PYTHON is what uv reads, so it is the
        # matrix variable itself; the ServiceBot-managed global prologue's `uv sync` honors it.
        - name: "Unit Tests"
          matrix:
            - env_var: UV_PYTHON
              values: ["3.11", "3.12", "3.13", "3.14", "3.15"]
          commands:
            - uv run --frozen pytest -m unit --junitxml=test-results.xml
      epilogue:
        always:
          commands:
            - "[[ -f test-results.xml ]] && test-results publish test-results.xml"

promotions:
  - name: Publish confluent-sql to PyPi
    pipeline_file: publish_to_pypi.yml
    auto_promote:
      when: "result = 'passed' and tag =~ '^v\\.'"

after_pipeline:
  task:
    jobs:
      - name: Publish CICD Results to Semaphore
        commands:
          - test-results gen-pipeline-report || echo "Could not publish pipeline test result report. Are there any test results to publish?"
